<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule | CBK Power Ratings 2026-27</title>
  <meta name="description" content="Daily schedule with spreads and win probabilities for the 2026-27 college basketball season.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <div class="brand">POWER<br>RATINGS</div>
      <div class="nav-label">Tools</div>
      <a class="nav-item" href="index.html">Ratings</a>
      <a class="nav-item active" href="schedule.html" aria-current="page">Schedule</a>
    </nav>

    <main class="content">
      <header class="page-head">
        <h1>SCHEDULE</h1>
        <div class="season">2026&ndash;27 &middot; <span id="schedule-count"></span></div>
      </header>

      <div class="day-picker">
        <button type="button" id="day-prev" class="day-nav" aria-label="Previous day">&larr;</button>
        <select id="day-select" aria-label="Day"></select>
        <button type="button" id="day-next" class="day-nav" aria-label="Next day">&rarr;</button>
        <select id="conf-filter" aria-label="Filter by conference"></select>
        <label class="conf-only"><input type="checkbox" id="conf-only"> Conference games only</label>
      </div>

      <div id="schedule-master"></div>
      <p class="load-error" id="load-error" hidden>The schedule data could not be loaded.</p>

      <footer>
        <span></span>
        <a href="https://github.com/connorriepma/CBK-Power-Ratings/blob/main/METHODOLOGY.md">Methodology</a>
      </footer>
    </main>
  </div>
  <script src="js/common.js"></script>
  <script src="js/schedule.js"></script>
</body>
</html>
