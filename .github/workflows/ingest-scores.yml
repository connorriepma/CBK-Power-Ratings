name: Ingest scores

# Pulls finished games from the CollegeBasketballData API and saves new ones to data/results.json on main.
#   * Scheduled runs SAVE. Manual runs ("Run workflow") only look unless you set save to true.
#   * Pause everything without touching code: set "enabled": false in data/ingest_config.json.
#   * Never overwrites a score that is already in results.json.
# One API call per check, and none when nothing is pending. Free tier = 1,000 calls/month.
#
# GitHub often delays or skips scheduled starts, so inside the game windows one scheduled start launches
# a job that stays running and checks every 15 minutes. src/ingest_window.py decides how long, in Pacific time:
#   Mon-Fri and Sun: 5 pm to 10 pm.   Saturday: 9 am to midnight (several back-to-back jobs).
# Extra starts are listed for both standard and daylight time; a start outside a window just checks once.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look"
        default: "2"
      save:
        description: "Save new scores (true) or only report (false)"
        default: "false"
      loop_minutes:
        description: "Test only: keep checking for this many minutes (0 = check once)"
        default: "0"
      interval:
        description: "Test only: seconds between checks when looping"
        default: "900"
  schedule:
    # Times are UTC.
    - cron: "7 0,1 * * *"         # evening window starts (5:07 pm Pacific, daylight or standard time)
    - cron: "37 1 * * *"          # backup start for the evening window
    - cron: "7 2 * * *"           # backup start for the evening window
    - cron: "7 16,17 * * 6"       # Saturday 9 am Pacific
    - cron: "45 21,22 * * 6"      # Saturday afternoon hand-off
    - cron: "25 3,4 * * 0"        # Saturday night hand-off (Sunday UTC)
    - cron: "22 17,19 * * 0"      # Sunday: extra checks at 9:22 am and 11:22 am Pacific for early games
    - cron: "22 21-23,0 * * *"    # hourly, afternoon games
    - cron: "22 6,8 * * *"        # late stragglers
    - cron: "22 15 * * *"         # morning catch-up
  push:
    branches: [api-saturday]

permissions:
  contents: write

concurrency:
  group: ingest-scores
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      DAYS: ${{ github.event.inputs.days || '2' }}
      SAVE: ${{ github.event_name == 'schedule' || github.event.inputs.save == 'true' }}
      EVENT: ${{ github.event_name }}
      LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '0' }}
      INTERVAL: ${{ github.event.inputs.interval || '900' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}
      - name: Pull scores
        run: |
          set -o pipefail
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          once() {
            if [ "$SAVE" = "true" ]; then FLAG="--write --max-new 250"; else FLAG=""; fi
            for attempt in 1 2 3; do
              python3 src/ingest_scores.py --days "$DAYS" $FLAG | tee -a "$GITHUB_STEP_SUMMARY" || return 1
              if [ "$SAVE" != "true" ] || git diff --quiet data/results.json; then return 0; fi
              # New scores were added: refuse to continue if a locked preseason rating would change, then lock new teams.
              python3 src/lock_preseason.py || return 1
              # Tournament games that are now decided (both teams known) go into the schedule in the same commit.
              python3 src/advance_brackets.py || return 1
              N=$(python3 -c "import json,subprocess;print(len(json.load(open('data/results.json')))-len(json.loads(subprocess.check_output(['git','show','HEAD:data/results.json']))))")
              git add data/results.json data/preseason_locks.json data/schedule.json data/tbd_games.json
              git commit -m "Auto-save scores ($N games from the API)"
              if git push origin HEAD:main; then return 0; fi
              echo "Push was rejected (someone saved at the same time). Starting over from the latest main."
              git fetch origin main
              git reset --hard origin/main
            done
            echo "Could not save after 3 tries" >&2
            return 1
          }

          # How long to keep checking: set by src/ingest_window.py for scheduled starts, or the test minutes.
          NOW=$(date -u +%s)
          END=$NOW
          if [ "$EVENT" = "schedule" ]; then
            END=$((NOW + $(python3 src/ingest_window.py)))
          elif [ "$LOOP_MINUTES" -gt 0 ]; then
            END=$((NOW + LOOP_MINUTES * 60))
          fi

          FAILED=0
          once && FAILED=0 || FAILED=1
          while [ "$(date -u +%s)" -lt "$((END - 1))" ]; do
            sleep "$INTERVAL"
            if [ "$EVENT" != "push" ] && [ "$SAVE" = "true" ]; then git fetch -q origin main && git reset -q --hard origin/main; fi
            once && FAILED=0 || FAILED=1
          done
          exit $FAILED
