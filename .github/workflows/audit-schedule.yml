name: Audit schedule

# Compares data/schedule.json with the API's season schedule. Dry run unless "apply" is true: then the API's version
# is written to schedule.json and each change is logged in data/schedule_changes.json (see src/audit_schedule.py).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the changes (true) or only report (false)"
        default: "false"
  push:
    branches: [api-schedule-audit, api-schedule-apply]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit
        run: |
          if [ "${{ github.event.inputs.apply }}" = "true" ] || [ "${{ github.ref_name }}" = "api-schedule-apply" ]; then FLAG="--apply"; else FLAG=""; fi
          python3 src/audit_schedule.py $FLAG | tee out.txt
          if [ -n "$FLAG" ] && ! git diff --quiet data/; then
            git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
            git add data/schedule.json data/postponed.json data/schedule_changes.json
            git commit -m "Schedule updated from the API ($(grep -c '^- ' out.txt) lines in the report)"
            git push origin HEAD:${{ github.ref_name }}
          fi
