# Read-only test of the CollegeBasketballData API. Prints a report; writes and commits nothing.
# Delete this branch (test-cbbd) to remove it completely.
name: Test CBBD API
on:
  push:
    branches: [test-cbbd]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Team-name match report
        run: python3 .github/scripts/probe_names.py
